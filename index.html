<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mr.Sofa | Digital Visiting Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root {
      --dark: #332119;
      --gold: #b78c4e;
      --red: #af4134;
      --cream: #faf6ee;
      --muted: #7b746d
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #b9a28b, #ece2d4);
      font-family: Inter, Arial, sans-serif;
      color: #171513;
      min-height: 100vh;
      padding: 20px 12px
    }

    a {
      text-decoration: none;
      color: inherit
    }

    .card {
      width: 100%;
      max-width: 440px;
      margin: auto;
      background: var(--cream);
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 16px 50px #36231740;
      border: 1px solid #fff8
    }

    .hero {
      position: relative;
      height: 219px;
      background: #3b291e url('mrsofa-banner.png') center / cover no-repeat
    }

    .content {
      padding: 25px 23px 20px;
      position: relative;
      border-radius: 30px 30px 0 0;
      margin-top: -16px;
      background: var(--cream)
    }

    .identity {
      text-align: center;
      color: #242222
    }

    .business-logo {
      display: block;
      max-width: 100%;
      height: auto;
      margin-inline: auto;
    }

    .identity h1 {
      font-family: Oswald, Arial, sans-serif;
      font-size: clamp(36px, 11vw, 49px);
      line-height: 1;
      letter-spacing: -1px;
      margin: 6px 0 17px;
      font-weight: 700;
      white-space: nowrap
    }

    .brand-initial {
      font-family: 'Great Vibes', cursive;
      font-size: 1.85em;
      font-weight: 400
    }

    .brand-trademark {
      font-family: Arial, sans-serif;
      font-size: .25em;
      letter-spacing: 0;
      vertical-align: super
    }

    .identity h4 {
      font-family: Oswald, Arial, sans-serif;
      font-size: clamp(23px, 7vw, 31px);
      line-height: 1.3;
      font-weight: 600;
      margin: 0 0 9px
    }

    .identity p {
      font-size: 14px;
      margin: 0
    }

    .line {
      width: 62px;
      height: 3px;
      border-radius: 4px;
      background: var(--gold);
      margin: 13px auto 0
    }

    .contact-layout {
      margin-top: 23px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 133px;
      gap: 13px
    }

    .details {
      min-width: 0
    }

    .detail {
      display: flex;
      gap: 9px;
      align-items: center;
      min-height: 62px;
      border-bottom: 1px solid #e3d7c8
    }

    .detail:last-child {
      border: 0
    }

    .circle {
      width: 35px;
      height: 35px;
      min-width: 35px;
      background: var(--dark);
      color: white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 16px
    }

    .circle.whatsapp {
      color: #25d366
    }

    .detail b {
      display: block;
      font-size: 11.5px;
      word-break: break-word;
      line-height: 1.45
    }

    .detail small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px
    }

    .actions {
      border-left: 1px solid var(--gold);
      padding-left: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .action {
      border-radius: 11px;
      min-height: 53px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      transition: transform .15s
    }

    .action:hover {
      transform: translateY(-2px)
    }

    .action.call {
      background: var(--dark)
    }

    .action.wa {
      background: #118144
    }

    .action.email {
      background: #ad4335
    }

    .action.website {
      background: #ba8c4b
    }

    .action.location {
      background: #eee0cb;
      color: var(--dark)
    }

    .socials {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0 19px
    }

    .socials a {
      width: 37px;
      height: 37px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 17px;
      color: white
    }

    .instagram {
      background: linear-gradient(45deg, #fbb638, #f02871, #a835bd)
    }

    .facebook {
      background: #2164bd
    }

    .pinterest {
      background: #dc0926
    }

    .youtube {
      background: #f22c2c
    }

    .linkedin {
      background: #087dbb
    }

    .features {
      border-top: 1px solid #bfa57d;
      padding-top: 17px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center
    }

    .feature {
      padding: 0 6px;
      border-right: 1px solid #cbb397
    }

    .feature:last-child {
      border: 0
    }

    .feature i {
      font-size: 23px;
      color: var(--dark);
      margin-bottom: 7px
    }

    .feature span {
      display: block;
      font-size: 9px;
      line-height: 1.4
    }

    .save {
      margin: 20px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      background: var(--dark);
      color: white;
      border-radius: 30px;
      width: 85%;
      min-height: 47px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer
    }

    @media(max-width:360px) {
      .content {
        padding: 21px 15px
      }

      .contact-layout {
        grid-template-columns: minmax(0, 1fr) 115px;
        gap: 8px
      }

      .actions {
        padding-left: 8px
      }

      .detail b {
        font-size: 10px
      }

      .detail small {
        font-size: 9px
      }

      .action {
        font-size: 11px
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="hero" role="img" aria-label="Mr.Sofa gold logo and luxury sofa interior"></div>
    <div class="content">
      <div class="identity">
        <div>
          <!-- <h1 aria-label="Mr. Sofa"><span aria-hidden="true"><span class="brand-initial">M</span>r. <span class="brand-initial">S</span>OFA<sup class="brand-trademark">TM</sup></span></h1>
          <h4>By Ramesh Master Ji</h4>
          <p>Business Manager</p>
          <div class="line"></div> -->
          <img class="business-logo" src="Mr_Sofa_Transparent.png" alt="Mr. Sofa by Ramesh Master Ji">
        </div>
      </div>
      <div class="contact-layout">
        <div class="details">
          <a class="detail" href="tel:+ 919266605003"><span class="circle"><i
                class="fa-solid fa-phone"></i></span><span><b>+91 9266605003</b><small>Call Now</small></span></a>
          <a class="detail" href="https://wa.me/919266605003" target="_blank" rel="noopener"><span
              class="circle whatsapp"><i class="fa-brands fa-whatsapp"></i></span><span><b>+91 9266605003</b><small>Chat on WhatsApp</small></span></a>
          <a class="detail" href="mailto:mrsofaamit@gmail.com"><span class="circle"><i
                class="fa-regular fa-envelope"></i></span><span><b>mrsofaamit@gmail.com</b><small>Send
                Email</small></span></a>
          <a class="detail" href="https://mrsofa.in/" target="_blank" rel="noopener"><span class="circle"><i
                class="fa-solid fa-globe"></i></span><span><b>www.mrsofa.in</b><small>Visit Website</small></span></a>
          <a class="detail"
            href="https://maps.app.goo.gl/UQRy6dam17zCDyxU7"
            target="_blank" rel="noopener"><span class="circle"><i
                class="fa-solid fa-location-dot"></i></span><span><b>Delhi, India</b><small>Our
                Location</small></span></a>
        </div>
        <div class="actions">
          <a class="action call" href="tel:+ 919266605003"><i class="fa-solid fa-phone"></i> Call</a>
          <a class="action wa" href="https://wa.me/919266605003" target="_blank" rel="noopener"><i
              class="fa-brands fa-whatsapp"></i> WhatsApp</a>
          <a class="action email" href="mailto:mrsofaamit@gmail.com"><i class="fa-regular fa-envelope"></i> Email</a>
          <a class="action website" href="https://mrsofa.in/" target="_blank" rel="noopener"><i
              class="fa-solid fa-globe"></i> Website</a>
          <a class="action location"
            href="https://maps.app.goo.gl/UQRy6dam17zCDyxU7"
            target="_blank" rel="noopener"><i class="fa-solid fa-location-dot"></i> Location</a>
        </div>
      </div>
      <!-- Replace # with the real profile URLs -->
      <nav class="socials" aria-label="Social media"><a href="https://www.instagram.com/mr.sofabyrameshmasterji/" class="instagram" aria-label="Instagram"><i
            class="fa-brands fa-instagram"></i></a><a href="https://www.facebook.com/JMV.MR.sofa/" class="facebook"
          aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a><a href="#" class="pinterest"
          aria-label="Pinterest"><i class="fa-brands fa-pinterest-p"></i></a><a href="#" class="youtube"
          aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a><a href="#" class="linkedin"
          aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a></nav>
      <div class="features">
        <div class="feature"><i class="fa-solid fa-couch"></i><span>Premium<br>Quality</span></div>
        <div class="feature"><i class="fa-regular fa-gem"></i><span>Stylish<br>Designs</span></div>
        <div class="feature"><i class="fa-solid fa-house"></i><span>Customized<br>Solutions</span></div>
        <div class="feature"><i class="fa-solid fa-gear"></i><span>Professional<br>Support</span></div>
      </div>
      <button class="save" id="save"><i class="fa-solid fa-download"></i> Save Contact (vCard)</button>
    </div>
  </main>
  <script>
    const vcf = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:', 'N:;Mr Sofa By Ramesh Master Ji;;;', 'ORG:Mr.Sofa', 'TITLE:Business Manager', 'TEL;TYPE=CELL:+919266605003', 'EMAIL:mrsofaamit@gmail.com', 'URL:https://www.mrsofa.in', 'ADR;TYPE=WORK:;;;Delhi;;;India', 'END:VCARD'].join('\r\n');
    function downloadContact() { const a = document.createElement('a'); const url = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard;charset=utf-8' })); a.href = url; a.download = 'Ramesh-Ji-MrSofa.vcf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000) }
    document.getElementById('save').addEventListener('click', downloadContact);
  </script>
</body>

</html>
